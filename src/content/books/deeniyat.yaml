title:
  en: Deeniyat
  ar: الدينيات
  ur: رسالۂ دینیات
  ur-latn: Risala-e-Deeniyat
  hi: रिसाला-ए-दीनियात
author:
  en: Syed Abul A'la Maududi
  ar: السيد أبو الأعلى المودودي
