  hi: सय्यद अबुल आला मौदूदी
description:
  en: A short, systematic introduction to Islam written as a textbook for the senior classes of Islamic schools. It moves step by step from what Islam is, to faith, prophethood and the articles of belief, then to worship, and finally to the Shariah and the rights it sets out. It is widely known in English as "Towards Understanding Islam".
  ar: مدخل موجز ومنظّم إلى الإسلام، كُتب منهجًا دراسيًا للصفوف العليا في المدارس الإسلامية. يتدرّج من بيان حقيقة الإسلام، إلى الإيمان والنبوة وأركان الاعتقاد، ثم العبادات، وأخيرًا الشريعة وما تقرّره من حقوق.
  ur: اسلام کا ایک مختصر اور مرتب تعارف، جو اسلامی اسکولوں کی اونچی جماعتوں کے نصاب کے طور پر لکھا گیا۔ یہ قدم بہ قدم اسلام کی حقیقت سے ایمان، نبوت اور عقائد تک، پھر عبادات تک، اور آخر میں شریعت اور اس کے مقرر کردہ حقوق تک لے جاتا ہے۔
  ur-latn: Islam ka ek mukhtasar aur murattab ta'aruf, jo Islami schoolon ki oonchi jamaaton ke nisaab ke taur par likha gaya. Yeh qadam ba qadam Islam ki haqeeqat se imaan, nubuwwat aur aqaaid tak, phir ibaadaat tak, aur aakhir mein shariat aur us ke muqarrar karda huqooq tak le jaata hai.
  hi: इस्लाम का एक मुख़्तसर और मुरत्तब तआरुफ़, जो इस्लामी स्कूलों की ऊँची जमातों के निसाब के तौर पर लिखा गया। यह क़दम ब क़दम इस्लाम की हक़ीक़त से ईमान, नुबुव्वत और अक़ाइद तक, फिर इबादात तक, और आख़िर में शरीअत और उसके मुक़र्रर करदा हुक़ूक़ तक ले जाता है।
